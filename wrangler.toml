name="tshirt-nubian-soul"
main="src/worker.js"
compatibility_date="2026-09-05"

[assets]
directory="./public"
binding="ASSETS"
run_worker_first=["/api/*","/media/*"]

[[d1_databases]]
binding="DB"
database_name="nubian-soul-store-tshirtes"
database_id="f4c36665-193c-4c11-bb03-1a05f20523f4"

[[r2_buckets]]
binding="PRODUCT_IMAGES"
bucket_name="nubian-soul-images"

[vars]
R2_PUBLIC_BASE_URL=""
# ADMIN_TOKEN لازم يتحط كـ secret مش هنا:
#   npx wrangler secret put ADMIN_TOKEN
# محليًا حطه في ملف .dev.vars (ADMIN_TOKEN=...) وده ملف متبعتش يترفع لأي مكان.
