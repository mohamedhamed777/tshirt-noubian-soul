name="nubian-soul-store"
main="src/worker.js"
compatibility_date="2026-09-05"

[assets]
directory="./public"
binding="ASSETS"
run_worker_first=["/api/*","/media/*"]

[[d1_databases]]
binding="DB"
database_name="nubian-soul-db"
database_id="REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding="PRODUCT_IMAGES"
bucket_name="nubian-soul-images"

[vars]
R2_PUBLIC_BASE_URL=""
